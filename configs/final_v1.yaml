    alpha: 0.9
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.0
    n_estimators: early_stop
    max_rounds: 5000
