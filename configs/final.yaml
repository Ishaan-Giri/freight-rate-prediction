version: 2
selected_candidate: v1_blend_w0.75
why_round_2:
- 'Why a second round: the first frozen pipeline under-predicted Sep-Oct by ~4-5%
  (original run).'
- Diagnosis showed an upward rate-level drift (~+0.65%/month beyond market_index)
  that tree models
- cannot extrapolate; the same drift shows as a growing bias in the dev folds. Round
  1 never offered
- a trend candidate, so this round adds fold-fitted detrending and recency weighting
  and re-selects
- on D1/D2 only. Because Sep-Oct prompted it, Sep-Oct is NOT independent evidence
  for this round.
selection_rule:
- 'Sep-Oct is never touched here. Selection follows rules declared before running:'
- ''
- '  PRIMARY  : all-row dollar MAE, full-feature mode, mean over D1 and D2.'
- '  ADOPT    : a more complex option is adopted only if it lowers PRIMARY by > 0.3%
  and does not'
- '             worsen any secondary check by > 2%: December-mode MAE, August MAE
  (the quote_signal'
- '             regime analogue of Nov-Dec), cold-start unseen-city MAE, worst-fold
  MAE.'
- '  SIMPLIFY : removing a feature / option is adopted if PRIMARY worsens by <= 0.3%
  and no secondary'
